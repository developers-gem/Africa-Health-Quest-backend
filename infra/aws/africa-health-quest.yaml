AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Africa Health Quest — one environment (staging or production). Web SPA on S3 + CloudFront; API and worker on
  ECS Fargate behind an HTTPS ALB with AWS WAF; private S3 media bucket; CloudWatch logs and alarms. MongoDB Atlas
  is provisioned separately (docs/release/DATABASE_BACKUP_GUIDE.md). Deploy the CloudFront certificate in us-east-1;
  everything else in the stack's region. See docs/release/DEPLOYMENT_GUIDE.md.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
  WebDomainName:
    Type: String
    Description: Public web domain, e.g. play.example.org
  ApiDomainName:
    Type: String
    Description: Public API domain on the same registrable domain, e.g. api.example.org (refresh cookies are SameSite=Strict)
  WebCertificateArn:
    Type: String
    Description: ACM certificate for WebDomainName in us-east-1 (CloudFront)
  ApiCertificateArn:
    Type: String
    Description: ACM certificate for ApiDomainName in this region (ALB)
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs (ALB)
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets with NAT egress (tasks reach Atlas, Anthropic, FCM, SMTP)
  ImageUri:
    Type: String
    Description: Backend image in ECR (tag = git SHA); CI updates services on each deploy
  AppSecretArn:
    Type: String
    Description: >-
      Secrets Manager secret (JSON) with keys MONGODB_URI, JWT_ACCESS_SECRET, DATA_ENCRYPTION_KEY, SMTP_URL,
      ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT_JSON (use "" for optional ones you do not use)
  GoogleClientIds:
    Type: String
    Default: ""
    Description: Comma-separated Google OAuth client ids (public values); empty disables Google sign-in
  MailFrom:
    Type: String
    Description: Sender address, e.g. "Africa Health Quest <no-reply@example.org>"
  AiProvider:
    Type: String
    AllowedValues: [anthropic, disabled]
    Default: disabled
  ApiMinTasks:
    Type: Number
    Default: 2
    MinValue: 1
  ApiMaxTasks:
    Type: Number
    Default: 6
  AlarmEmail:
    Type: String
    Description: Address that receives alarm notifications (confirm the SNS subscription email)

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]

Resources:
  # ---------------------------------------------------------------- Storage
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  # ---------------------------------------------------------------- Web: CloudFront
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "ahq-${EnvironmentName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "ahq-${EnvironmentName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes (paths without a file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.indexOf('.') === -1) { r.uri = '/index.html'; }
          return r;
        }

  WebSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "ahq-${EnvironmentName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client;
              style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
              img-src 'self' data: https://${ApiDomainName}; font-src 'self' data:;
              connect-src 'self' https://${ApiDomainName} https://accounts.google.com/gsi/;
              frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Africa Health Quest web (${EnvironmentName})"
        Aliases: [!Ref WebDomainName]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All # includes edge locations in Africa
        ViewerCertificate:
          AcmCertificateArn: !Ref WebCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref WebSecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN

  # ---------------------------------------------------------------- Network
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AHQ ALB - HTTPS from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AHQ tasks - API port from the ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "60" }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref ApiCertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ApiTargetGroup }]

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  # ---------------------------------------------------------------- WAF (shared coarse rate limit, decision A-7)
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "ahq-${EnvironmentName}-api"
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement: { Limit: 3000, AggregateKeyType: IP, EvaluationWindowSec: 300 }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY # media uploads (≤10 MB) are validated by the API
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs

  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt ApiWebAcl.Arn

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ahq/${EnvironmentName}/api"
      RetentionInDays: !If [IsProduction, 400, 30]

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ahq/${EnvironmentName}/worker"
      RetentionInDays: !If [IsProduction, 400, 30]

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: media-bucket
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${MediaBucket.Arn}/media/*"

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ahq-${EnvironmentName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 4000, Protocol: tcp }]
          ReadonlyRootFilesystem: false
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "4000" }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: TRUST_PROXY, Value: "1" }
            - { Name: WEB_APP_URL, Value: !Sub "https://${WebDomainName}" }
            - { Name: CORS_ORIGINS, Value: !Sub "https://${WebDomainName}" }
            - { Name: MAIL_TRANSPORT, Value: smtp }
            - { Name: MAIL_FROM, Value: !Ref MailFrom }
            - { Name: AI_PROVIDER, Value: !Ref AiProvider }
            - { Name: GOOGLE_CLIENT_IDS, Value: !Ref GoogleClientIds }
            - { Name: MEDIA_STORAGE_DRIVER, Value: s3 }
            - { Name: S3_MEDIA_BUCKET, Value: !Ref MediaBucket }
            - { Name: S3_MEDIA_PREFIX, Value: media/ }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: RATE_LIMIT_STORE, Value: mongo }
          Secrets:
            - { Name: MONGODB_URI, ValueFrom: !Sub "${AppSecretArn}:MONGODB_URI::" }
            - { Name: JWT_ACCESS_SECRET, ValueFrom: !Sub "${AppSecretArn}:JWT_ACCESS_SECRET::" }
            - { Name: DATA_ENCRYPTION_KEY, ValueFrom: !Sub "${AppSecretArn}:DATA_ENCRYPTION_KEY::" }
            - { Name: SMTP_URL, ValueFrom: !Sub "${AppSecretArn}:SMTP_URL::" }
            - { Name: ANTHROPIC_API_KEY, ValueFrom: !Sub "${AppSecretArn}:ANTHROPIC_API_KEY::" }
            - Name: FIREBASE_SERVICE_ACCOUNT_JSON
              ValueFrom: !Sub "${AppSecretArn}:FIREBASE_SERVICE_ACCOUNT_JSON::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ahq-${EnvironmentName}-worker"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Command: ["node", "dist/worker.js"]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "4000" }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: TRUST_PROXY, Value: "1" }
            - { Name: WEB_APP_URL, Value: !Sub "https://${WebDomainName}" }
            - { Name: CORS_ORIGINS, Value: !Sub "https://${WebDomainName}" }
            - { Name: MAIL_TRANSPORT, Value: smtp }
            - { Name: MAIL_FROM, Value: !Ref MailFrom }
            - { Name: AI_PROVIDER, Value: !Ref AiProvider }
            - { Name: GOOGLE_CLIENT_IDS, Value: !Ref GoogleClientIds }
            - { Name: MEDIA_STORAGE_DRIVER, Value: s3 }
            - { Name: S3_MEDIA_BUCKET, Value: !Ref MediaBucket }
            - { Name: S3_MEDIA_PREFIX, Value: media/ }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: RATE_LIMIT_STORE, Value: mongo }
          Secrets:
            - { Name: MONGODB_URI, ValueFrom: !Sub "${AppSecretArn}:MONGODB_URI::" }
            - { Name: JWT_ACCESS_SECRET, ValueFrom: !Sub "${AppSecretArn}:JWT_ACCESS_SECRET::" }
            - { Name: DATA_ENCRYPTION_KEY, ValueFrom: !Sub "${AppSecretArn}:DATA_ENCRYPTION_KEY::" }
            - { Name: SMTP_URL, ValueFrom: !Sub "${AppSecretArn}:SMTP_URL::" }
            - { Name: ANTHROPIC_API_KEY, ValueFrom: !Sub "${AppSecretArn}:ANTHROPIC_API_KEY::" }
            - Name: FIREBASE_SERVICE_ACCOUNT_JSON
              ValueFrom: !Sub "${AppSecretArn}:FIREBASE_SERVICE_ACCOUNT_JSON::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: api
      LaunchType: FARGATE
      DesiredCount: !Ref ApiMinTasks
      TaskDefinition: !Ref ApiTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 4000, TargetGroupArn: !Ref ApiTargetGroup }

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      ServiceName: worker
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref WorkerTaskDefinition
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${ApiService.Name}"
      MinCapacity: !Ref ApiMinTasks
      MaxCapacity: !Ref ApiMaxTasks

  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: api-cpu-60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ---------------------------------------------------------------- Monitoring and error tracking
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlarmEmail }]

  ApiErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: "{ $.level >= 50 }"
      MetricTransformations:
        - {
            MetricNamespace: AHQ,
            MetricName: !Sub "${EnvironmentName}-api-errors",
            MetricValue: "1",
            DefaultValue: 0,
          }

  WorkerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: "{ $.level >= 50 }"
      MetricTransformations:
        - {
            MetricNamespace: AHQ,
            MetricName: !Sub "${EnvironmentName}-worker-errors",
            MetricValue: "1",
            DefaultValue: 0,
          }

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Server errors logged by the API (level error/fatal); see Logs Insights by requestId
      Namespace: AHQ
      MetricName: !Sub "${EnvironmentName}-api-errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Errors logged by the worker (notifications outbox, background jobs)
      Namespace: AHQ
      MetricName: !Sub "${EnvironmentName}-worker-errors"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API 5xx responses
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API p95 latency above 1 s for 15 minutes
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API tasks failing the /ready check (database unreachable or crash loop)
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlarmTopic]

  WorkerNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The worker service has no running task (push notifications stop)
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt WorkerService.Name }
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebDistributionDomain:
    Description: CNAME target for WebDomainName
    Value: !GetAtt WebDistribution.DomainName
  ApiLoadBalancerDns:
    Description: CNAME/alias target for ApiDomainName
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  MediaBucketName:
    Value: !Ref MediaBucket
  ApiTaskFamily:
    Value: !Sub "ahq-${EnvironmentName}-api"
  WorkerTaskFamily:
    Value: !Sub "ahq-${EnvironmentName}-worker"
